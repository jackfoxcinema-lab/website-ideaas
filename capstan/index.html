<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Capstan</title>
<meta name="description" content="A field tape recorder for your voice notes. Spin the platter to scrub.">
<meta name="theme-color" content="#e9e8e4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Capstan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="device" id="device">
  <header class="head">
    <div class="brand">
      <div class="model" aria-hidden="true">CS-1</div>
      <div class="brand-row">
        <span class="mic-hole" aria-hidden="true"></span>
        <span class="led" id="led" aria-hidden="true"></span>
        <span class="brand-name">CAPSTAN</span>
      </div>
    </div>
    <button class="oled" id="oled" aria-label="Display. Opens your tapes.">
      <canvas id="oledCanvas" width="96" height="32" aria-hidden="true"></canvas>
    </button>
  </header>

  <section class="platter-zone" id="platterZone">
    <div class="well" id="well">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring-track" cx="50" cy="50" r="48.9"/>
        <circle class="ring-fill" id="ringFill" cx="50" cy="50" r="48.9" pathLength="1000" transform="rotate(-90 50 50)"/>
      </svg>
      <div class="platter" id="platter" role="slider" tabindex="0" aria-label="Tape. Drag in a circle to scrub."
           aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="No tape loaded">
        <div class="rot" id="rot" aria-hidden="true">
          <svg class="engrave" viewBox="-50 -50 100 100">
            <defs><path id="rimPath" d="M -41.5 0 A 41.5 41.5 0 0 0 41.5 0"/></defs>
            <line x1="31.5" y1="-31.5" x2="-31.5" y2="31.5"/>
            <text class="spec" id="specRate" transform="translate(-21.5 -19.5) rotate(45)" text-anchor="middle">48/16</text>
            <g transform="translate(20.5 22.5) rotate(45)">
              <text class="spec" id="specSide" x="-3.2" text-anchor="end">C30</text>
              <rect class="spec-box" x="-1.6" y="-3.15" width="10.6" height="4.2" rx="0.4"/>
              <text class="spec small" id="specStock" x="3.7" y="-0.12" text-anchor="middle">II</text>
            </g>
            <text class="rim"><textPath href="#rimPath" startOffset="50%" text-anchor="middle">SPIN TO SCRUB</textPath></text>
          </svg>
          <div class="pack" id="pack"><i></i></div>
        </div>
        <div class="hub" aria-hidden="true"></div>
        <div class="rot screws" id="screws" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </div>
  </section>

  <section class="mid">
    <div class="mid-left">
      <button class="round-key" id="tapesKey" aria-label="Tapes library">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="9" cy="12" r="1.9"/><circle cx="15" cy="12" r="1.9"/><path d="M9 10.1h6M7.5 18l1.5-2.4h6l1.5 2.4"/></svg>
      </button>
      <span class="engr">TAPES</span>
    </div>
    <div class="mid-center">
      <span class="engr">STOCK</span>
      <button class="stock-key" id="stockKey" aria-label="Tape stock: Type 2. Tap to change.">
        <span id="stockName">TYPE II</span>
      </button>
    </div>
    <div class="cue-pill" aria-label="Rewind and fast forward" role="group">
      <button class="cue-key fwd" id="ffKey" aria-label="Forward 5 seconds. Hold to fast forward."><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6l7 6-7 6zM12 6l7 6-7 6z"/></svg></button>
      <button class="cue-key rew" id="rewKey" aria-label="Back 5 seconds. Hold to rewind."><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6l-7 6 7 6zM12 6l-7 6 7 6z"/></svg></button>
    </div>
  </section>

  <section class="deck">
    <div class="transport">
      <button class="key" id="recKey" aria-label="Record" aria-pressed="false"><span class="g-rec"></span><span class="key-label">REC</span></button>
      <button class="key" id="playKey" aria-label="Play" aria-pressed="false"><span class="g-play"></span><span class="key-label">PLAY</span></button>
      <button class="key" id="stopKey" aria-label="Stop"><span class="g-stop"></span><span class="key-label">STOP</span></button>
    </div>
    <div class="fader" id="fader" role="slider" tabindex="0" aria-label="Drive: how hard the voice hits the tape" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40">
      <span class="engr fader-label">DRIVE</span>
      <div class="fader-slot" id="faderSlot">
        <span class="groove"></span><span class="groove"></span>
        <span class="ticks" aria-hidden="true"></span>
        <div class="fader-cap" id="faderCap"></div>
      </div>
    </div>
  </section>

  <aside class="sticker" id="sticker" hidden>
    <p id="stickerText"></p>
    <button class="sticker-x" id="stickerX" aria-label="Dismiss">✕</button>
  </aside>

  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="libTitle" aria-hidden="true">
    <div class="grabber" aria-hidden="true"></div>
    <header class="lib-head">
      <div class="lib-top">
        <h2 class="lib-title" id="libTitle">TAPES</h2>
        <button class="done-key" id="doneKey">DONE</button>
      </div>
      <div class="lib-hero">
        <div class="lib-count" id="libCount">00</div>
        <div class="lib-date">
          <div class="lib-month" id="libMonth">OCTOBER</div>
          <div class="lib-year" id="libYear">2026</div>
        </div>
      </div>
      <div class="cal" id="cal" aria-label="Recording days this month"></div>
    </header>
    <div class="lib-scroll" id="libScroll">
      <ol class="lib-list" id="libList"></ol>
      <div class="lib-empty" id="libEmpty" hidden>
        <div class="empty-num">00</div>
        <p>No tapes yet.</p>
        <button class="empty-rec" id="emptyRec"><span class="g-rec"></span>Start recording</button>
      </div>
      <footer class="lib-foot">
        <div class="settings">
          <label class="toggle"><span>Key sounds</span><input type="checkbox" id="setClicks"><i></i></label>
          <label class="toggle"><span>Auto-rewind after recording</span><input type="checkbox" id="setRewind"><i></i></label>
          <label class="toggle"><span>Export with tape character</span><input type="checkbox" id="setExportTape"><i></i></label>
        </div>
        <p class="storage" id="storage"></p>
        <p class="motto">PRESS REC. THINK LATER.</p>
      </footer>
    </div>
    <div class="toast" id="toast" role="status" hidden><span id="toastText"></span><button id="toastUndo">UNDO</button></div>
  </section>
</main>


<div class="sr-only" id="live" aria-live="polite"></div>

<script src="dsp.js"></script>
<script src="app.js"></script>
</body>
</html>
