<!doctype html><html><head><style>
html,body{margin:0;background:transparent}
.ic{width:1024px;height:1024px;position:relative;overflow:hidden;
 background:linear-gradient(160deg,#e4e5e2,#c9cac7);}
.ic.mask .pl{transform:translate(-50%,-50%) scale(.8)}
.pl{position:absolute;left:50%;top:50%;width:720px;height:720px;border-radius:50%;transform:translate(-50%,-50%);
 background:conic-gradient(from 200deg,#d9dad7,#f4f4f2 8%,#cfd0cd 18%,#c3c4c1 30%,#e2e3e0 42%,#f6f6f4 55%,#cfd0cd 66%,#bfc0bd 80%,#d9dad7);
 box-shadow:0 0 0 14px #b6b7b4, 0 0 0 16px rgba(0,0,0,.15), 0 30px 60px rgba(0,0,0,.25)}
.ln{position:absolute;left:50%;top:50%;width:660px;height:5px;background:#3c3d3a;transform:translate(-50%,-50%) rotate(-45deg);border-radius:3px}
.hub{position:absolute;left:50%;top:50%;width:220px;height:220px;border-radius:50%;transform:translate(-50%,-50%);
 background:linear-gradient(135deg,#8e8f8c,#d5d6d3 38%,#fafaf8 50%,#d5d6d3 62%,#a3a4a1);box-shadow:0 0 0 3px rgba(0,0,0,.2),0 10px 20px rgba(0,0,0,.3)}
.dot{position:absolute;left:236px;top:236px;width:120px;height:120px;border-radius:50%;background:#ff5a1f;transform:translate(-50%,-50%);box-shadow:inset 0 -8px 10px rgba(0,0,0,.15)}
</style></head><body>
<div class="ic" id="a"><div class="pl"><div class="ln"></div><div class="hub"></div><div class="dot"></div></div></div>
<div class="ic mask" id="b"><div class="pl"><div class="ln"></div><div class="hub"></div><div class="dot"></div></div></div>
</body></html>
