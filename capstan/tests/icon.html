<!doctype html><html><head><style>
html,body{margin:0;background:transparent}
.ic{width:1024px;height:1024px;position:relative;overflow:hidden;background:#e9e8e4}
.ic.mask .pl{transform:translate(-50%,-50%) scale(.8)}
.pl{position:absolute;left:50%;top:50%;width:720px;height:720px;border-radius:50%;transform:translate(-50%,-50%);background:#dcdbd6}
.ln{position:absolute;left:50%;top:50%;width:640px;height:5px;background:#141414;transform:translate(-50%,-50%) rotate(-45deg)}
.hub{position:absolute;left:50%;top:50%;width:216px;height:216px;border-radius:50%;transform:translate(-50%,-50%);background:#141414}
.dot{position:absolute;left:236px;top:236px;width:116px;height:116px;border-radius:50%;background:#f25c1f;transform:translate(-50%,-50%)}
</style></head><body>
<div class="ic" id="a"><div class="pl"><div class="ln"></div><div class="hub"></div><div class="dot"></div></div></div>
<div class="ic mask" id="b"><div class="pl"><div class="ln"></div><div class="hub"></div><div class="dot"></div></div></div>
</body></html>
